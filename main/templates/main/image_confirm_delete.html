{% extends 'main/layout.html' %}

{% block title %}Deleting {{ image.name }} — {{ request.user.username }}{% endblock %}

{% block content %}
<main class="delete">
    <h1>Are you sure you want to delete {{ image.name }}?</h1>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Yes, delete for sure" class="type-danger">
    </form>
</main>
{% endblock content %}
